<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Booking Work<br />Shop</span>
          <span class="brand-subtitle">Panel de gestión</span>
        </div>
      </div>

      @if (canAccessRoles()) {
      <nav class="menu">
        <span class="menu-label">MENÚ</span>
        <a routerLink="/roles" routerLinkActive="active" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Roles</span>
        </a>
        <a routerLink="/users" routerLinkActive="active" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>Usuarios</span>
        </a>
      </nav>
      }
    </div>

    <div class="user-card">
      <div class="user-avatar">{{ authStore.userInitials() }}</div>
      <div class="user-info">
        <span class="user-name" [title]="authStore.username()">
          {{ authStore.username() }}
        </span>
        <span class="user-role">{{ authStore.primaryRoleLabel() }}</span>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="breadcrumb">
        @if (currentBreadcrumb()) {
        <a routerLink="/roles" class="breadcrumb-parent">Administración</a>
        <span class="breadcrumb-separator">&rsaquo;</span>
        <span class="breadcrumb-current">{{ currentBreadcrumb() }}</span>
        }
      </div>

      <button type="button" class="notification-btn" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span class="notification-dot"></span>
      </button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
