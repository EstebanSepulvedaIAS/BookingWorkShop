security:
  jwt:
    user: esteban_user
    key: esteban_key

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: reserve
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5433/reserve_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
logging:
  level:
    org.springframework.r2dbc: DEBUG