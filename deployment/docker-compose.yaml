services:
  postgres-db:
    image: postgres:16-alpine
    container_name: reserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserve_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ../SQL/reservasCreate.ddl:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../SQL/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d reserve_db"]
      interval: 5s
      timeout: 120s
      retries: 5

  reserve-backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: java-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: r2dbc:postgresql://postgres-db:5432/reserve_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy