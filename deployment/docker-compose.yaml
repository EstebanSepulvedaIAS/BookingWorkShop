services:
  postgres-db:
    image: postgres:16-alpine
    container_name: reserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserve_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - ../SQL/reservasCreate.ddl:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../SQL/postgres_data:/var/lib/postgresql/data

  reserve_backend:
    build: .
    container_name: java_backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: r2dbc:postgresql://postgres_db:5433/reserve_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres-db