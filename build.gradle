plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.auth0:java-jwt:4.6.2'
    compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
	testImplementation 'net.masterthought:cucumber-reporting:5.5.3'
	testImplementation 'com.atlassian.oai:swagger-request-validator-core:3.0.0'
	testImplementation 'commons-codec:commons-codec:1.15'
	testImplementation 'org.mozilla:rhino:1.7.14'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
}

sourceSets {
    test{
        java{
            srcDir 'src/acceptanceTest/src/test/java'
        }
        resources {
            srcDir 'src/acceptanceTest/src/test/resources'
        }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}